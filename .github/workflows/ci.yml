name: Rust, WASM, and practice website
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup show
      - name: Format and lint
        run: |
          cargo fmt --all --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Native tests
        run: |
          cargo test --locked --workspace
          cargo test --locked --workspace --release
      - name: Independent BIP 93 boundary comparison
        run: python3 scripts/check-conformance.py
      - name: Reproduce public fixtures
        run: |
          python3 scripts/generate-fixtures.py
          python3 scripts/generate-volvelle-fixtures.py
          git diff --exit-code -- tests/fixtures/bip93.json web/tests/fixtures/volvelles.json web/lib/wheel-data.json
      - name: Install matching WASM runner
        run: cargo install wasm-bindgen-cli --version 0.2.127 --locked
      - name: WASM tests and JavaScript ABI
        run: bash scripts/test-wasm.sh
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Rebuild browser module from current Rust source
        run: bash scripts/build-web-wasm.sh
      - name: Configure GitHub Pages
        id: pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Practice website integration and static export
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          npm --prefix web ci --ignore-scripts
          npm --prefix web test
          npm --prefix web run typecheck
          npm --prefix web run lint
          npm --prefix web run build
          npm --prefix web run check:export
      - name: Upload verified website
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: web/dist/client
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
