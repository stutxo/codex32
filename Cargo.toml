[workspace]
members = ["crates/codex32-core", "crates/codex32-wallet", "crates/codex32-wasm"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.dependencies]
bech32 = "=0.12.0"
rand_core = "0.9"
zeroize = "1.8"
thiserror = "2"
bdk_wallet = { version = "=3.1.0", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-test = "0.3"

[profile.release]
lto = true
codegen-units = 1

[workspace.lints.rust]
unsafe_code = "forbid"
